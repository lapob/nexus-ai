name: Public availability

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: nexusnxs-public-availability
  cancel-in-progress: false

jobs:
  public-endpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/monitor-product-availability.js --once --strict-current
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: nexusnxs-availability-${{ github.run_id }}
          path: |
            qa-artifacts/availability-samples.ndjson
            qa-artifacts/availability-report.json
          if-no-files-found: error
          retention-days: 30

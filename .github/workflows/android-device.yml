name: Android physical device

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexusnxs-android-device
  cancel-in-progress: false

jobs:
  physical-matrix:
    runs-on: [self-hosted, windows, nexusnxs-android]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run android:remote
      - run: npm run android:console
      - run: npm run qa:android:device:strict
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: nexusnxs-android-device-${{ github.run_id }}
          path: |
            qa-artifacts/android-public-matrix
            qa-artifacts/android-control-matrix
          if-no-files-found: error
          retention-days: 30

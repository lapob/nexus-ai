name: Security

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read
  security-events: write
  id-token: write
  attestations: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-and-supply-chain:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6d786de4d6f3531a740e445b53a42b622bbbace8 # v3
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit signatures
      - run: npm run check:publication
      - run: npm run security:regression
      - run: npm run security:dast
      - run: npm run audit:runtime
      - run: npm run audit:tooling
      - run: npm run sbom
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: qa-artifacts/nexus-sbom.cdx.json
      - uses: github/codeql-action/analyze@6d786de4d6f3531a740e445b53a42b622bbbace8 # v3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexusnxs-sbom
          path: |
            qa-artifacts/nexus-sbom.cdx.json
            qa-artifacts/nexus-sbom.cdx.json.sha256
          if-no-files-found: error
          retention-days: 30

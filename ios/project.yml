name: NexusNXS
options:
  bundleIdPrefix: com.nexusnxs
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
targets:
  NexusNXS:
    type: application
    platform: iOS
    sources: [NexusNXS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexusnxs.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NexusNXS
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Speak with Nexus using the microphone.
        INFOPLIST_KEY_NSCameraUsageDescription: Attach a photo to your conversation.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    scheme: {}

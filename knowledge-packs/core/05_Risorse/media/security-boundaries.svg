<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Confini della knowledge</title><desc id="d">Separazione tra fonti pubbliche, private, autorizzazione e segreti.</desc><rect width="1200" height="420" rx="36" fill="#061011"/><g font-family="Inter,Arial" text-anchor="middle"><rect x="60" y="78" width="270" height="264" rx="30" fill="#0b2021" stroke="#55d8da" stroke-width="2"/><text x="195" y="138" fill="#d8eeee" font-size="27">Fonti pubbliche</text><text x="195" y="181" fill="#79a7a8" font-size="18">licenza e provenienza</text><rect x="465" y="78" width="270" height="264" rx="30" fill="#0b2021" stroke="#55d8da" stroke-width="2"/><text x="600" y="138" fill="#d8eeee" font-size="27">Fonti private</text><text x="600" y="181" fill="#79a7a8" font-size="18">accesso autorizzato</text><rect x="870" y="78" width="270" height="264" rx="30" fill="#160e10" stroke="#b85e68" stroke-width="2"/><text x="1005" y="138" fill="#f0dadd" font-size="27">Segreti</text><text x="1005" y="181" fill="#b98a91" font-size="18">fuori dalla knowledge</text><text x="397" y="217" fill="#55d8da" font-size="42">→</text><text x="802" y="217" fill="#b85e68" font-size="42">×</text><text x="600" y="286" fill="#79a7a8" font-size="18">policy prima del retrieval</text></g></svg>
